[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # `paste` is a transitive dep (via ratatui → indoc/paste) marked unmaintained.
    # The author explicitly recommends moving on; nothing actionable for us
    # until ratatui drops it. Tracked upstream.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    # `error-code` (transitive via arboard → x11rb) is BSL-1.0.
    "BSL-1.0",
    # `webpki-roots` ships under CDLA-Permissive-2.0 — straightforward permissive license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
