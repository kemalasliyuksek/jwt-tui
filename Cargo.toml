[workspace]
resolver = "2"
members = ["crates/jwt-core", "crates/jwt-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kemalasliyuksek/jwt-tui"
homepage = "https://github.com/kemalasliyuksek/jwt-tui"
authors = ["Kemal Asliyuksek <kemal@kemalasliyuksek.com>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allowlist with justification (see docs/DECISIONS.md):
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
# Acronyms like JWT/SPKI/DER/PKCS trip doc_markdown noise.
doc_markdown = "allow"
# We carefully mask before casting in DER length encoding, hex math, etc.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# Pedantic would force every option into &-form; not idiomatic for our APIs.
ref_option = "allow"
needless_pass_by_value = "allow"
# Brief flags branches_sharing_code on perfectly readable encodings.
branches_sharing_code = "allow"
# Crate-internal Result aliases are fine.
option_if_let_else = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
unused_self = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
unnecessary_wraps = "allow"
items_after_statements = "allow"
ignored_unit_patterns = "allow"
vec_init_then_push = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
cast_possible_wrap = "allow"
uninlined_format_args = "allow"
too_many_lines = "allow"
similar_names = "allow"
unnested_or_patterns = "allow"
single_match_else = "allow"
missing_const_for_fn = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
base64 = "0.22"
jsonwebtoken = "9"
ring = "0.17"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3"
age = "0.11"
rayon = "1"
directories = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hex = "0.4"
url = "2"
once_cell = "1"
humantime = "2"

# dev-deps
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.dev]
opt-level = 0
